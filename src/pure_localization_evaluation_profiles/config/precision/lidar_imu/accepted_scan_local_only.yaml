/**:
  ros__parameters:
    # Consume one causal odometry sample for every accepted LiDAR registration.
    # The LiDAR/IMU-only evaluation leaves global authority inputs
    # unsubscribed, so only precision-local odometry is produced.
    raw_odom_topic: /localization/gyro_lidar_odom_scan
    fallback.gnss_position_enabled: false

    # Raw input is the physical accepted-scan stream (nominally about 10 Hz),
    # not the 50 Hz wall-timer odometry used by the production precision
    # overlay.  Allow one complete accepted-scan interval while retaining the
    # base 2.0 m/s and 0.5 rad/s correction-rate limits.
    local_correction.max_dt_sec: 0.15
    local_correction.max_translation_step_m: 0.20
    local_correction.max_yaw_step_rad: 0.05
