/**:
  ros__parameters:
    # The Livox bag stores acceleration in g while the estimator consumes SI.
    # This matches the acc_scale used when its GLIM reference was generated.
    imu_corrected.linear_acceleration_scale: 9.80665
    imu_corrected.max_sample_gap_sec: 0.02
    imu_corrected.max_boundary_gap_sec: 0.02

    lidar_odom.accepted_scan_odom.enable: true
    lidar_odom.accepted_scan_odom.topic: /localization/gyro_lidar_odom_scan

    # Test-only MID360 sensor calibration for a controlled A/B.  The fixed
    # bias is the median gyro-z value during the bag's first stationary 1 s.
    # Disabling adaptation keeps this calibration constant for the full run.
    gyro_bias.enable: false
    gyro_bias.initial_bg_rad_s: 0.006959692

    # Exercise the direct scan/IMU composition path so the A/B isolates it
    # from the fixed-lag smoother used by the adaptive baseline.
    lidar_odom.smoother.enable: false

    # Keep the accepted MID360 convergence settings identical to the existing
    # default-epsilon profile; strict epsilon is intentionally unsupported by
    # the fixed-bias-direct policy.
    lidar_odom.gicp.trans_eps: 0.0005
    lidar_odom.gicp.rot_eps: 0.002
