/**:
  ros__parameters:
    # Recording-specific published evaluation profile.
    imu_corrected.linear_acceleration_scale: 1.0
    imu_corrected.max_sample_gap_sec: 0.041
    imu_corrected.max_boundary_gap_sec: 0.025

    # Freeze one odometry sample at each registration-accepted scan.  This
    # causal stream is the trajectory evaluated against GLIM; the regular
    # odometry topic is a wall-timer publication of the latest held state.
    lidar_odom.accepted_scan_odom.enable: true
    lidar_odom.accepted_scan_odom.topic: /localization/gyro_lidar_odom_scan
