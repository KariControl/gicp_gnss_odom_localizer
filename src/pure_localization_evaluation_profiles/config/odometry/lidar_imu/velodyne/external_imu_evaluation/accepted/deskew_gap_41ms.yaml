imu_undistorter:
  ros__parameters:
    base_frame: base_link
    imu_frame: imu
    scan_frame: velodyne

    points_in_topic: /points_raw
    points_out_topic: /localization/points_undistorted
    imu_topic: /imu
    twist_topic: ""

    # The evaluated Velodyne input stores relative point time in seconds. Values run
    # from about -0.100 s to zero, so the PointCloud2 header marks scan end.
    time_fields: [time]
    prefer_relative_time: true
    time_scale: 1.0
    fallback_scan_period: 0.1
    allow_linear_time_fallback: false
    cloud_stamp_is_start: false
    reference_time: end
    point_time_tolerance_sec: 0.002

    imu_buffer_sec: 2.0
    # The nominal 50 Hz stream has isolated missing samples.  This profile
    # bridges one missing interval but still rejects longer outages.
    max_imu_gap_sec: 0.041
    max_imu_boundary_gap_sec: 0.025
    max_time_offset_sec: 0.2
    max_abs_gyro_radps: 20.0

    use_translation: false
    use_twist_speed: false
    allow_default_speed_fallback: false
    input_qos_best_effort: false
    publish_diagnostics: true
    diag_throttle_ms: 1000
    max_pending_clouds: 4
