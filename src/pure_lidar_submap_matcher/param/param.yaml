submap_matcher:
  ros__parameters:
    base_frame: base_link
    precision_frame: odom_precision
    scan_topic: /localization/submap_scan
    correction_topic: /localization/submap_correction
    diagnostics_topic: diagnostics
    num_threads: 2
    match_every: 1
    min_keyframes: 3
    max_keyframes: 15
    min_points: 200
    consecutive_rejections_before_rebuild: 8
    keyframe.min_interval_sec: 0.25
    keyframe.max_interval_sec: 1.0
    keyframe.min_translation_m: 0.75
    keyframe.min_yaw_rad: 0.15
    map.voxel_leaf_m: 0.35
    map.max_points: 80000
    registration.type: VGICP
    registration.max_corr_dist_m: 1.0
    registration.max_iterations: 30
    registration.transformation_epsilon: 0.0005
    registration.rotation_epsilon: 0.0005
    registration.correspondence_randomness: 20
    registration.voxel_resolution: 1.0
    gate.max_fitness: 1.0
    gate.min_inlier_ratio: 0.25
    gate.max_correction_translation_m: 0.75
    gate.max_correction_yaw_rad: 0.15
    gate.max_correction_z_m: 0.25
    gate.max_correction_roll_pitch_rad: 0.15
    robust.window_size: 7
    robust.min_consistent: 3
    robust.consistency_translation_m: 0.30
    robust.consistency_yaw_rad: 0.06
    robust.huber_translation_m: 0.15
    robust.huber_yaw_rad: 0.03
    robust.max_commit_pivot_step_m: 0.50
    robust.max_commit_yaw_step_rad: 0.12
    output.position_stddev_m: 0.20
    output.yaw_stddev_rad: 0.04
    tf_lookup_timeout_sec: 0.25
    diagnostics_period_sec: 1.0
