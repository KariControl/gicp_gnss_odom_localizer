    trajectory_heading_epoch_max_gap_sec: 0.5
    # Input silence is separate from unusable-fix duration so an ordinary
    # 1 Hz GGA stream does not reset the epoch on every sample.
    trajectory_heading_input_max_gap_sec: 2.0
    # Reject trajectory chords formed during more than 45 deg of accumulated
    # corrected-IMU turn activity; bounded IMU propagation may still be used
    # from a seed valid in the current epoch.
    trajectory_heading_max_turn_activity_rad: 0.7853981633974483
    # When corrected-IMU heading is enabled, compare every trajectory candidate
    # with the last trusted heading propagated to the same stamp.
    # A mismatch starts a fresh chord segment and keeps IMU propagation active;
    # 0.07 rad also keeps downstream target changes below the 0.08 rad limit.
    trajectory_heading_max_seed_innovation_rad: 0.07
    trajectory_heading_sigma_floor_deg: 3.0
    trajectory_heading_min_confidence: 0.3
    # Both chord endpoints must have a finite sigma no greater than this.
    # This keeps high-confidence fixes with intentionally inflated covariance
    # out of the absolute-heading seed.
    trajectory_heading_max_position_sigma_m: 5.0
    # Never advertise or store a trajectory heading that the downstream fusion
