/**:
  ros__parameters:
    base_frame: base_link
    # Empty means: use the incoming message frame. Required static TFs to
    # base_frame must still exist; identity is never assumed.
    imu_frame: ""
    scan_frame: ""

    points_in_topic: /points_raw
    points_out_topic: /localization/points_undistorted
    imu_topic: /imu
    twist_topic: ""

    time_fields: [time, t, timestamp, offset_time, time_stamp]
    prefer_relative_time: true
    time_scale: 0.0
    fallback_scan_period: 0.1
    allow_linear_time_fallback: false
    cloud_stamp_is_start: true
    reference_time: start
    point_time_tolerance_sec: 0.002

    imu_buffer_sec: 2.0
    max_imu_gap_sec: 0.02
    max_imu_boundary_gap_sec: 0.02
    max_time_offset_sec: 0.2
    max_abs_gyro_radps: 20.0

    # Translation deskew is opt-in because it requires a time-aligned speed
    # source. No constant-speed fallback is used by default.
    use_translation: false
    # Vehicle speed is also opt-in. A deployment that needs translational
    # deskew must explicitly enable both flags and configure twist_topic.
    use_twist_speed: false
    twist_buffer_sec: 2.0
    max_twist_gap_sec: 0.1
    default_speed_mps: 0.0
    allow_default_speed_fallback: false
    max_speed_mps: 60.0

    input_qos_best_effort: false
    publish_diagnostics: true
    diag_throttle_ms: 1000
    # Briefly hold clouds whose scan-end IMU sample is still in flight.
    max_pending_clouds: 4
