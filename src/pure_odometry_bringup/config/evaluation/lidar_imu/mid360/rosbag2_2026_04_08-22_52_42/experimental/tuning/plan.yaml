version: 1
dataset:
  id: mid360_internal_imu_2026_04_08
  sensor: mid360
  bag: rosbag/rosbag2_2026_04_08-22_52_42
  glim_dir: /home/motoya/loc_ws/glim_map/mid360_dense_20260812_142237
  mid_yaw_policy: fixed-bias-direct
  gicp_epsilon: default
  label: MID-360 internal IMU tuned final
  imu_profile: src/pure_odometry_bringup/config/evaluation/lidar_imu/mid360/rosbag2_2026_04_08-22_52_42/accepted/deskew.yaml
  odom_profile: src/pure_odometry_bringup/config/evaluation/lidar_imu/mid360/rosbag2_2026_04_08-22_52_42/accepted/odom_fixed_bias_direct.yaml
execution:
  minimum_free_gib: 50
  serial: true
  prune_rejected_bags: true
alignment_anchor_stamp_ns: 1775656363443486720
split_seconds:
  training: [[0, 30], [60, 90], [120, 180], [240, 270]]
  holdout: [[30, 60], [90, 120], [180, 240], [270, 294.3]]
low_motion_reference_step_threshold_m: 0.002
score_weights:
  training_xy_rmse_m: 0.25
  training_yaw_rmse_deg: 0.15
  training_rpe_10m_translation_rmse_m: 0.15
  training_rpe_10m_yaw_rmse_deg: 0.10
  training_path_ratio_absolute_error: 0.20
  training_low_motion_excess_path_m: 0.15
score_scales:
  training_xy_rmse_m: 1.0
  training_yaw_rmse_deg: 3.0
  training_rpe_10m_translation_rmse_m: 0.5
  training_rpe_10m_yaw_rmse_deg: 2.5
  training_path_ratio_absolute_error: 0.05
  training_low_motion_excess_path_m: 0.5

runtime_hard_gates:
  deskew_success_minimum: 0.99
  registration_density_minimum: 0.95
  association_coverage_minimum: 0.95

selection_policy:
  minimum_score_improvement_fraction: 0.02
  final_precision_stage: submap_correction
  control_candidates:
    lidar_filter: f00
    scan_vgicp: g00
    scan_acceptance: a00
    fixed_bias: b00
    smoother: q00
    stop_detection: d00
    snapshot_cadence: r02
    submap_geometry: p00
    submap_correction: c00
  baseline_nonregression:
    reference_stage: lidar_filter
    reference_candidate: f00
    metrics:
      xy_rmse_m: {max_ratio: 1.02, absolute_margin: 0.01}
      yaw_rmse_deg: {max_ratio: 1.02, absolute_margin: 0.05}
      path_ratio_absolute_error: {max_ratio: 1.05, absolute_margin: 0.002}
      rpe_10m_translation_rmse_m: {max_ratio: 1.02, absolute_margin: 0.01}
      rpe_10m_yaw_rmse_deg: {max_ratio: 1.02, absolute_margin: 0.05}
  precision_hard_gates:
    path_ratio_min: 0.95
    path_ratio_max: 1.05
    max_xy_rmse_ratio_to_scan: 1.0
    max_rpe_translation_ratio_to_scan: 1.0
    max_rpe_yaw_ratio_to_scan: 1.0

# All candidates replay the complete bag. Selection reads training blocks only;
# holdout is opened once from a separately retained final pair after all stages.
stages:
  - id: lidar_filter
    depends_on: null
    mode: baseline
    candidates:
      - {id: f00, odom: {lidar_odom.max_range_m: 100.0, lidar_odom.voxel_leaf_m: 0.30}}
