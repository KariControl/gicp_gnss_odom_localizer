diagnostic_aggregator:
  ros__parameters:
    pub_rate: 10.0
    base_path: localization
    analyzers:
      imu_undistortion:
        type: diagnostic_aggregator/GenericAnalyzer
        path: imu_undistortion
        startswith: ["localization/imu_undistortion"]
      gyro_odometer:
        type: diagnostic_aggregator/GenericAnalyzer
        path: gyro_odometer
        startswith: ["localization/gyro_odometer"]
      submap_matcher:
        type: diagnostic_aggregator/GenericAnalyzer
        path: submap_matcher
        startswith: ["localization/submap_matcher"]
        num_items: 0
      precision_global_localizer:
        type: diagnostic_aggregator/GenericAnalyzer
        path: precision_global_localizer
        startswith: ["localization/precision_global_localizer"]
        num_items: 0
      nmea_gga_conversion:
        type: diagnostic_aggregator/GenericAnalyzer
        path: nmea_gga_conversion
        startswith: ["localization/nmea_gga_conversion"]
      gnss_map_odom_fusion:
        type: diagnostic_aggregator/GenericAnalyzer
        path: gnss_map_odom_fusion
        startswith: ["localization/gnss_map_odom_fusion", "localization/map_odom_fusion"]
      autoware_localization_adapter:
        type: diagnostic_aggregator/GenericAnalyzer
        path: autoware_localization_adapter
        startswith: ["localization/gicp_gnss_autoware_adapter"]
